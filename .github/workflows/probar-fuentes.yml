# Prueba manual de las fuentes de datos desde los servidores de GitHub.
# No guarda nada en el repositorio: solo muestra en el registro qué responde cada fuente.
name: Probar fuentes

on:
  workflow_dispatch:
    inputs:
      solo_trends_extra:
        description: "Probar solo las preguntas extra de Google Trends (tarea 6.1)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probar:
    if: ${{ !inputs.solo_trends_extra }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5       # v5 usa Node.js 24 (la v4 usaba Node.js 20, retirado)
      - uses: actions/setup-python@v6   # v6 usa Node.js 24 (la v5 usaba Node.js 20, retirado)
        with:
          python-version: "3.12"
      - name: Probar cada fuente
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python recolector/probar_fuentes.py

      # El recolector de verdad, pero guardando en una carpeta temporal (nunca en datos/):
      # sirve para probar cambios del recolector, incluso desde otra rama, antes de usarlos.
      - name: Probar el recolector completo sin guardar
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 recolector/recolectar.py --carpeta "$RUNNER_TEMP/prueba"
          python3 - "$RUNNER_TEMP/prueba" <<'FIN'
          import json, sys, pathlib
          m = json.loads(next(pathlib.Path(sys.argv[1]).glob("*.jsonl")).read_text().splitlines()[-1])
          tw = m["twitch"]
          if "error" in tw:
              sys.exit("Twitch quedó como hueco: " + tw["error"])
          canales = tw["canales"]
          print(f"Twitch: {len(canales)} canales, {sum('foto' in c for c in canales)} con foto de perfil"
                + (f"; error de fotos: {tw['error_fotos']}" if "error_fotos" in tw else ""))
          for c in canales[:3]:
              print(" ", c["login"], c.get("foto", "(sin foto)"))
          # Tareas 6.3, 6.2 y 6.4: ranking de Twitch, tendencias, tráilers y videos en español (comprobar nombres y números).
          for nombre in ("twitch_ranking", "youtube_tendencias", "youtube_trailers", "youtube_es"):
              print(nombre + ":", json.dumps(m.get(nombre), ensure_ascii=False)[:3000])
          FIN

  # Tarea 6.1: las 5 preguntas extra a Google Trends, guardando en una carpeta temporal (nunca
  # en datos/). Va aparte, y solo si se marca la casilla, para no gastar consultas a Trends en
  # cada prueba normal. Tarda unos minutos por las pausas entre preguntas.
  trends_extra:
    if: ${{ inputs.solo_trends_extra }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5       # v5 usa Node.js 24 (la v4 usaba Node.js 20, retirado)
      - uses: actions/setup-python@v6   # v6 usa Node.js 24 (la v5 usaba Node.js 20, retirado)
        with:
          python-version: "3.12"
      - name: Hacer las 5 preguntas extra sin guardar
        run: |
          python3 recolector/trends_extra.py --carpeta "$RUNNER_TEMP/trends"
          python3 - "$RUNNER_TEMP/trends" <<'FIN'
          import json, sys, pathlib
          r = json.loads(next(pathlib.Path(sys.argv[1]).glob("*.json")).read_text())
          print("Países:", json.dumps(r["paises"]["lista"][:25], ensure_ascii=False))
          print("Relacionadas:", json.dumps(r["relacionadas"], ensure_ascii=False)[:3000])
          print("Comparación (últimos 3):", json.dumps(r["comparacion"]["puntos"][-3:], ensure_ascii=False))
          print("Histórica (sep 2013 y últimos 3):",
                json.dumps([p for p in r["historica"]["puntos"] if p["t"].startswith("2013-09")] + r["historica"]["puntos"][-3:]))
          FIN
