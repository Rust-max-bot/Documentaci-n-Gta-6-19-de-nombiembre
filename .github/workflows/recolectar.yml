# Mide las fuentes y guarda una línea en datos/AAAA-MM-DD.jsonl: cada hora, y cada 30 minutos
# la semana del lanzamiento (decisión de Bruno, 2026-11-12).
# Se apaga, se enciende o se alarga en recolector/interruptor.json (no hace falta tocar este archivo).
# Lo lanza el despertador de Cloudflare (despertador/worker.js) a los minutos 7 y 37 (UTC),
# porque GitHub no lanzaba a tiempo sus ejecuciones programadas. Por eso aquí no hay
# "schedule": si lo hubiera, algunos turnos se medirían dos veces (tarea 1.4, 2026-11-13).
name: Recolectar datos

on:
  workflow_dispatch:   # lo usa el despertador; también sirve para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5   # v5 usa Node.js 24 (la v4 usaba Node.js 20, retirado)

      - name: Medir las fuentes
        id: medir
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 recolector/recolectar.py

      - name: Guardar la medición en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p datos   # con el interruptor apagado puede no existir todavía
          git add datos/
          if git diff --cached --quiet; then
            echo "No hay medición nueva que guardar."
            exit 0
          fi
          git commit -q -m "Medición automática $(date -u +%Y-%m-%dT%H:%MZ)"
          for intento in 1 2 3 4 5; do
            if git push -q; then exit 0; fi
            echo "El push falló (intento $intento); se traen los cambios y se reintenta."
            sleep $((intento * 5))
            git pull -q --rebase
          done
          exit 1

      # La medición ya quedó guardada con el hueco anotado; esto solo hace que GitHub avise.
      - name: Avisar si alguna fuente falló
        if: steps.medir.outputs.fallos != ''
        run: |
          echo "::error::Fuentes con hueco en esta medición: ${{ steps.medir.outputs.fallos }}"
          exit 1
